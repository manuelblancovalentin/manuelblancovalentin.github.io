# Global tag taxonomy used by display cards and filter controls.
#
# Future front matter can use grouped taxonomy:
#
# taxonomy:
#   type: [paper]
#   discipline: [hep, computer-engineering]
#   topic: [hardware, asic, neural-networks]
#   technology: [tsmc28, fdsoi]
#   venue: [tns]
#
# Existing flat `tags: [...]` still work. For venue tags, `match:` lets the
# site infer a tag from the publication `venue:` field without editing every
# publication immediately.

groups:
  - slug: type
    label: Type
  - slug: discipline
    label: Discipline
  - slug: domain
    label: Domain
  - slug: topic
    label: Topic
  - slug: technology
    label: Technology
  - slug: foundry
    label: Foundry
  - slug: process-node
    label: Process Node
  - slug: software
    label: Software
  - slug: venue
    label: Venue / Publisher
  - slug: organization
    label: Organization / Funding
  - slug: contribution
    label: Contribution
  - slug: other
    label: Other
  - slug: status
    label: Status
  - slug: year
    label: Year

