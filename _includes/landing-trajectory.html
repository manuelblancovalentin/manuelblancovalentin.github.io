<div class="landing-trajectory" aria-label="Professional and academic trajectory">
  <div class="landing-trajectory__map" aria-hidden="false" style="--landing-trajectory-aspect: 758.8 / 574;">
    <img class="landing-trajectory__basemap" src="/images/maps/trajectory-map.svg" alt="Cropped world map showing the trajectory Barcelona to Rio de Janeiro to Chicago to San Jose to Chicago to Austin" loading="lazy">
    {% include landing-trajectory-routes.svg %}

    <button class="landing-trajectory__pin landing-trajectory__pin--barcelona" type="button" onmouseenter="this.classList.add('is-active')" onmouseleave="this.classList.remove('is-active')" onfocus="this.classList.add('is-active')" onblur="this.classList.remove('is-active')" onclick="this.classList.add('is-active')">
      {% include lucide-icon.html name="map-pin" class="landing-trajectory__pin-icon" size=25 %}
      <span class="landing-trajectory__label">Barcelona</span>
      <span class="landing-tooltip" role="tooltip">
        <strong>Robotics Engineering</strong>
        <span>Spain / Barcelona</span>
        <em>robotics · electronics · control · software · systems thinking</em>
      </span>
    </button>

    <button class="landing-trajectory__pin landing-trajectory__pin--rio" type="button" onmouseenter="this.classList.add('is-active')" onmouseleave="this.classList.remove('is-active')" onfocus="this.classList.add('is-active')" onblur="this.classList.remove('is-active')" onclick="this.classList.add('is-active')">
      {% include lucide-icon.html name="map-pin" class="landing-trajectory__pin-icon" size=25 %}
      <span class="landing-trajectory__label">Rio de Janeiro</span>
      <span class="landing-tooltip" role="tooltip">
        <strong>Applied Physics + Industrial AI</strong>
        <span>Rio de Janeiro / Brazil</span>
        <em>deep learning · imaging · reservoir characterization · scientific computing</em>
      </span>
    </button>

    <button class="landing-trajectory__pin landing-trajectory__pin--chicago" type="button" onmouseenter="this.classList.add('is-active')" onmouseleave="this.classList.remove('is-active')" onfocus="this.classList.add('is-active')" onblur="this.classList.remove('is-active')" onclick="this.classList.add('is-active')">
      {% include lucide-icon.html name="map-pin" class="landing-trajectory__pin-icon" size=25 %}
      <span class="landing-trajectory__label">Chicago</span>
      <span class="landing-tooltip" role="tooltip">
        <strong>Ph.D. at Northwestern</strong>
        <span>Chicago, USA</span>
        <em>ASIC/FPGA design · ML accelerators · scientific instrumentation · hls4ml · neuromorphic learning</em>
      </span>
    </button>

    <button class="landing-trajectory__pin landing-trajectory__pin--fermilab" type="button" onmouseenter="this.classList.add('is-active')" onmouseleave="this.classList.remove('is-active')" onfocus="this.classList.add('is-active')" onblur="this.classList.remove('is-active')" onclick="this.classList.add('is-active')">
      {% include lucide-icon.html name="map-pin" class="landing-trajectory__pin-icon" size=25 %}
      <span class="landing-trajectory__label">Fermilab</span>
      <span class="landing-tooltip" role="tooltip">
        <strong>Fermilab / Scientific Instrumentation</strong>
        <span>Batavia, Illinois, USA</span>
        <em>particle detectors · ASIC workflows · radiation tolerance · HEP instrumentation</em>
      </span>
    </button>

    <button class="landing-trajectory__pin landing-trajectory__pin--sanjose" type="button" onmouseenter="this.classList.add('is-active')" onmouseleave="this.classList.remove('is-active')" onfocus="this.classList.add('is-active')" onblur="this.classList.remove('is-active')" onclick="this.classList.add('is-active')">
      {% include lucide-icon.html name="map-pin" class="landing-trajectory__pin-icon" size=25 %}
      <span class="landing-trajectory__label">San José</span>
      <span class="landing-tooltip" role="tooltip">
        <strong>Cadence internship / EDA + Timing Signoff</strong>
        <span>San José, California, USA</span>
        <em>static timing analysis · Tempus · aging analysis · PVT corners · reliability · signoff methodology</em>
      </span>
    </button>

    <button class="landing-trajectory__pin landing-trajectory__pin--austin" type="button" onmouseenter="this.classList.add('is-active')" onmouseleave="this.classList.remove('is-active')" onfocus="this.classList.add('is-active')" onblur="this.classList.remove('is-active')" onclick="this.classList.add('is-active')">
      {% include lucide-icon.html name="map-pin" class="landing-trajectory__pin-icon" size=25 %}
      <span class="landing-trajectory__label">Austin</span>
      <span class="landing-tooltip" role="tooltip">
        <strong>AMD internship / CPU RAS Reliability Architecture</strong>
        <span>Austin, USA</span>
        <em>CPU architecture · reliability · availability · serviceability · memory hierarchy · ECC · fault tolerance</em>
      </span>
    </button>
  </div>
</div>
